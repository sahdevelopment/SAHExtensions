name: Automatic Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create publishing token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish to release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          cp dist/sah-extensions.user.js /tmp/sah-extensions.user.js

          git config user.name "sah-bot[bot]"
          git config user.email "sah-build-bot@studentaanhuis.nl"

          git checkout --orphan release
          git rm -rf . || true

          cp /tmp/sah-extensions.user.js sah-extensions.user.js

          git add sah-extensions.user.js
          git commit -m "Publish sah-extensions.user.js"

          gh auth setup-git

          git push \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:release \
            --force